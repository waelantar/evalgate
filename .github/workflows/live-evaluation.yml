name: Governed Live Evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-evaluation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  openrouter-generation:
    runs-on: ubuntu-latest
    environment: live-evaluation
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg18-trixie@sha256:9d2e61c7352b9e9f4798df5fd9a498f043f4cda1cdacc707de3d198650f4321e
        env:
          POSTGRES_DB: evalgate
          POSTGRES_USER: evalgate
          POSTGRES_PASSWORD: evalgate_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evalgate -d evalgate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      EVALGATE_ENVIRONMENT: ci
      EVALGATE_DATABASE_URL: postgresql+psycopg://evalgate:evalgate_ci_only@127.0.0.1:5432/evalgate
      EVALGATE_EMBEDDING_MODE: reference
      EVALGATE_GENERATION_MODE: live
      EVALGATE_REFERENCE_EMBEDDING_SNAPSHOT: ../../.evalgate-cache/reference-embedding/snapshot
      EVALGATE_LIVE_PROVIDER: openrouter
      EVALGATE_OPENROUTER_MODEL: deepseek/deepseek-v4-flash
      EVALGATE_OPENROUTER_API_KEY: ${{ secrets.EVALGATE_OPENROUTER_API_KEY }}
      EVALGATE_LIVE_EVAL_BUDGET_USD: "4.60"
      EVALGATE_LIVE_EVAL_STOP_USD: "4.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          python-version: "3.13.15"
      - run: test -n "$EVALGATE_OPENROUTER_API_KEY"
      - run: uv sync --locked
        working-directory: apps/api
      - run: python scripts/provision_reference_snapshot.py --destination .evalgate-cache/reference-embedding/snapshot
      - run: uv run evalgate-db seed-empty
        working-directory: apps/api
      - run: uv run evalgate-ingest --corpus northstar-operations
        working-directory: apps/api
      - run: >-
          uv run evalgate-live-evaluate
          --index-version 6932f8da-e71b-533f-ae2b-4c969cd3acd2
          --output ../../artifacts/evaluation-live-openrouter.json
          --markdown ../../artifacts/evaluation-live-openrouter.md
          --repetitions 2
        working-directory: apps/api
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: live-evaluation-openrouter-${{ github.sha }}
          path: artifacts/evaluation-live-openrouter.*
          if-no-files-found: error
