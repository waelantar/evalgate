name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - run: python scripts/check_publication.py
      - run: python scripts/check_metadata.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          python-version: "3.13.15"
      - run: uv sync --locked
        working-directory: apps/api
      - run: uv run ruff format --check migrations src tests
        working-directory: apps/api
      - run: uv run ruff check migrations src tests
        working-directory: apps/api
      - run: uv run mypy src tests
        working-directory: apps/api
      - run: uv run pytest -m "not integration"
        working-directory: apps/api

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg18-trixie@sha256:9d2e61c7352b9e9f4798df5fd9a498f043f4cda1cdacc707de3d198650f4321e
        env:
          POSTGRES_DB: evalgate
          POSTGRES_USER: evalgate
          POSTGRES_PASSWORD: evalgate_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evalgate -d evalgate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      EVALGATE_TEST_ADMIN_URL: postgresql://evalgate:evalgate_ci_only@127.0.0.1:5432/evalgate
      EVALGATE_REQUIRE_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          python-version: "3.13.15"
      - run: uv sync --locked
        working-directory: apps/api
      - run: python scripts/check_database_image.py
      - run: python scripts/provision_reference_snapshot.py --destination .evalgate-cache/reference-embedding/snapshot
      - run: uv run evalgate-db seed-empty
        working-directory: apps/api
        env:
          EVALGATE_ENVIRONMENT: ci
          EVALGATE_DATABASE_URL: postgresql+psycopg://evalgate:evalgate_ci_only@127.0.0.1:5432/evalgate
      - run: uv run evalgate-ingest --corpus northstar-operations
        working-directory: apps/api
        env:
          EVALGATE_ENVIRONMENT: ci
          EVALGATE_EMBEDDING_MODE: reference
          EVALGATE_GENERATION_MODE: disabled
          EVALGATE_REFERENCE_EMBEDDING_SNAPSHOT: ../../.evalgate-cache/reference-embedding/snapshot
          EVALGATE_DATABASE_URL: postgresql+psycopg://evalgate:evalgate_ci_only@127.0.0.1:5432/evalgate
      - run: >-
          uv run evalgate-evaluate --mode retrieval
          --index-version 6932f8da-e71b-533f-ae2b-4c969cd3acd2
          --output ../../artifacts/retrieval-pr.json
          --markdown ../../artifacts/retrieval-pr.md
        working-directory: apps/api
        env:
          EVALGATE_ENVIRONMENT: ci
          EVALGATE_EMBEDDING_MODE: reference
          EVALGATE_GENERATION_MODE: disabled
          EVALGATE_REFERENCE_EMBEDDING_SNAPSHOT: ../../.evalgate-cache/reference-embedding/snapshot
          EVALGATE_DATABASE_URL: postgresql+psycopg://evalgate:evalgate_ci_only@127.0.0.1:5432/evalgate
      - run: >-
          python scripts/check_retrieval_baseline.py
          --artifact artifacts/retrieval-pr.json
          --baseline contracts/evaluation/retrieval-baseline-v1.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: retrieval-pr-${{ github.sha }}
          path: artifacts/retrieval-pr.*
          if-no-files-found: error
      - run: uv run evalgate-ingest --corpus northstar-operations
        working-directory: apps/api
        env:
          EVALGATE_ENVIRONMENT: ci
          EVALGATE_EMBEDDING_MODE: reference
          EVALGATE_GENERATION_MODE: disabled
          EVALGATE_REFERENCE_EMBEDDING_SNAPSHOT: ../../.evalgate-cache/reference-embedding/snapshot
          EVALGATE_DATABASE_URL: postgresql+psycopg://evalgate:evalgate_ci_only@127.0.0.1:5432/evalgate
      - run: uv run pytest -m integration
        working-directory: apps/api
        env:
          EVALGATE_REQUIRE_REFERENCE_TESTS: "1"
          EVALGATE_REFERENCE_EMBEDDING_SNAPSHOT: ../../.evalgate-cache/reference-embedding/snapshot

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose config --quiet
