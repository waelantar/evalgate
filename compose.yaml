name: evalgate

services:
  db:
    image: pgvector/pgvector:0.8.5-pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evalgate}
      POSTGRES_USER: ${POSTGRES_USER:-evalgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evalgate_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - evalgate_postgres:/var/lib/postgresql
    restart: unless-stopped

volumes:
  evalgate_postgres:
