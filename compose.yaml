name: evalgate

services:
  db:
    image: pgvector/pgvector:0.8.5-pg18-trixie@sha256:9d2e61c7352b9e9f4798df5fd9a498f043f4cda1cdacc707de3d198650f4321e
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evalgate}
      POSTGRES_USER: ${POSTGRES_USER:-evalgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evalgate_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - evalgate_postgres:/var/lib/postgresql
    restart: unless-stopped

  api:
    profiles: ["release"]
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: evalgate-api:0.9.0
    environment:
      EVALGATE_ENVIRONMENT: local
      EVALGATE_HOST: 0.0.0.0
      EVALGATE_PORT: 8000
      EVALGATE_DATABASE_URL: postgresql+psycopg://evalgate:evalgate_local_only@db:5432/evalgate
      EVALGATE_EMBEDDING_MODE: fixture
      EVALGATE_GENERATION_MODE: fixture
    ports:
      - "127.0.0.1:${EVALGATE_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: "no"

volumes:
  evalgate_postgres:
